[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroflex"
version = "0.1.0"
description = "HYDROFLEX AI: climate-aware stochastic optimization of hydropower, renewables and storage for Albania (research prototype)"
authors = [{ name = "Ajsel Budlla" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "highspy>=1.7", "pypsa>=0.30",
  "xarray>=2023.1", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5", "matplotlib>=3.8", "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "httpx>=0.27", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["packages", "apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running optimisation tests", "pypsa: tests requiring PyPSA"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
